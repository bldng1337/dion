name: Nightly

# Build a fresh rolling "nightly" release on every new commit to main.
# The previous nightly release is deleted up front (Clear), each matrix leg
# builds and uploads a workflow artifact (Build), and only if every leg
# succeeded are the artifacts plus a small nightly.json manifest (which the
# app's updater reads to compare commit hashes) attached to the fresh release
# (Publish). A failed or cancelled run therefore leaves no nightly release at
# all instead of one still serving the outdated version.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  Clear:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Delete previous nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # No-op on the first run, when no nightly release exists yet.
        run: gh release delete nightly --yes --cleanup-tag || true

  Build:
    needs: Clear
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        build_mode:
          - release
    env:
      CARGOKIT_VERBOSE: 1
    steps:
      - name: Free Disk Space (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"

      - uses: actions/checkout@v4
        with:
          # Full history so we have a usable commit hash/date.
          fetch-depth: 0
      - name: Resolve Flutter version
        id: flutter-action
        uses: subosito/flutter-action@44ac965b96f18d999802d4b807e3256d5a3f9fa1 # 2.16.0
        with:
          channel: "stable"
          dry-run: true
      - name: Cache Flutter SDK
        uses: actions/cache@v4
        with:
          path: ${{ steps.flutter-action.outputs.CACHE-PATH }}
          key: ${{ steps.flutter-action.outputs.CACHE-KEY }}
          restore-keys: ${{ steps.flutter-action.outputs.CACHE-KEY }}
      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.flutter-action.outputs.PUB-CACHE-PATH }}
          key: ${{ steps.flutter-action.outputs.PUB-CACHE-KEY }}-${{ hashFiles('**/pubspec.lock') }}
          # No `restore-keys`: a pubspec.lock change is a clean miss so
          # `flutter pub get` installs fresh from the committed lock instead of
          # re-resolving against a stale cache (which corrupts
          # .dart_tool/package_graph.json on Flutter 3.44.6).
      - name: Install Flutter SDK
        uses: subosito/flutter-action@44ac965b96f18d999802d4b807e3256d5a3f9fa1 # 2.16.0
        with:
          flutter-version: ${{ steps.flutter-action.outputs.VERSION }}
          cache: false
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        id: rust
        with:
          cache: false
      - name: Cache cargo build state (cargokit plugins)
        uses: actions/cache@v4
        with:
          path: |
            build/flutter_surrealdb/build
            build/rdion_runtime/build
            build/rhttp/build
            build/windows/x64/plugins/flutter_surrealdb/cargokit_build
            build/windows/x64/plugins/rdion_runtime/cargokit_build
            build/windows/x64/plugins/rhttp/cargokit_build
            ~/.cargo/registry
            ~/.cargo/git
          key: cargokit-${{ runner.os }}-${{ steps.rust.outputs.cachekey }}-${{ hashFiles('**/pubspec.lock') }}
          # The plugins' Cargo.lock lives in the pub cache, so pubspec.lock is
          # the closest content key available. Unlike the pub cache above,
          # restore-keys is safe: cargo fingerprints its artifacts and
          # rebuilds anything stale, so a dep bump recompiles only what
          # changed instead of the full ~45 min tree.
          restore-keys: |
            cargokit-${{ runner.os }}-${{ steps.rust.outputs.cachekey }}-
      - name: Set up JDK 17
        if: (matrix.os == 'ubuntu-latest')
        uses: actions/setup-java@v3
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle
      - name: Install build tools
        if: (matrix.os == 'ubuntu-latest')
        run: |
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
          yes | sdkmanager --licenses
          sdkmanager --install "platforms;android-36" "build-tools;34.0.0"

      - name: Pub Get
        run: flutter pub get
      - name: Build Launcher Icons
        run: flutter pub run flutter_launcher_icons
      - name: update-packages
        if: (matrix.os == 'ubuntu-latest')
        run: sudo apt-get update
      - name: Install mpv
        if: (matrix.os == 'ubuntu-latest')
        run: sudo apt install libmpv-dev mpv --fix-missing

      - name: Create output directory
        run: mkdir -p ./output

      - name: Compute build metadata
        shell: bash
        run: |
          NORMAL_VERSION=$(awk '/^version:/ { print $2 }' pubspec.yaml)
          SHORT_SHA=$(git rev-parse --short HEAD)
          COMMIT_DATE=$(git show -s --format=%cI HEAD)
          BUILD_VERSION="${NORMAL_VERSION}+nightly.${SHORT_SHA}"
          {
            echo "NORMAL_VERSION=$NORMAL_VERSION"
            echo "SHORT_SHA=$SHORT_SHA"
            echo "BUILD_VERSION=$BUILD_VERSION"
            echo "COMMIT_DATE=$COMMIT_DATE"
          } >> "$GITHUB_ENV"
          echo "Building nightly $BUILD_VERSION"

      - name: Versions
        run: |
          flutter --version
          dart --version
          cargo --version

      - name: Build Android (${{ matrix.build_mode }})
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          # Universal fat APK first, then the per-ABI splits so devices on a
          # known arch can download only their own native libs.
          flutter build apk --${{ matrix.build_mode }} --verbose \
            --dart-define=BUILD_VERSION="$BUILD_VERSION" \
            --dart-define=BUILD_COMMIT="$SHORT_SHA" \
            --dart-define=BUILD_CHANNEL=nightly
          flutter build apk --${{ matrix.build_mode }} --split-per-abi --verbose \
            --dart-define=BUILD_VERSION="$BUILD_VERSION" \
            --dart-define=BUILD_COMMIT="$SHORT_SHA" \
            --dart-define=BUILD_CHANNEL=nightly
      - name: Sign APK
        if: matrix.os == 'ubuntu-latest'
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 -d > android/keystore.jks
          echo "${{ secrets.KEY_PASSWORD }}" > android/keypass
          echo "${{ secrets.KEYSTORE_PASSWORD }}" > android/storepass
          for apk in build/app/outputs/flutter-apk/app-*.apk; do
            $ANDROID_HOME/build-tools/34.0.0/apksigner sign --ks android/keystore.jks --key-pass file:android/keypass --ks-pass file:android/storepass --ks-key-alias dion --verbose "$apk"
            $ANDROID_HOME/build-tools/34.0.0/apksigner verify --print-certs --verbose "$apk"
          done
      - name: Move APK
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          for apk in build/app/outputs/flutter-apk/app-*.apk; do
            name=$(basename "$apk" .apk)
            suffix=${name#app-}
            abi=${suffix%-${{ matrix.build_mode }}}
            if [ "$abi" = "${{ matrix.build_mode }}" ]; then
              mv "$apk" ./output/dion-${{ matrix.build_mode }}.apk
            else
              mv "$apk" "./output/dion-${{ matrix.build_mode }}-${abi}.apk"
            fi
          done
          ls -la ./output

      - name: Enable Developer Mode (symlinks for pdfrx native assets)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock" /v AllowDevelopmentWithoutDevLicense /t REG_DWORD /d 1 /f
      - name: Build Windows (${{ matrix.build_mode }})
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          flutter build windows --${{ matrix.build_mode }} --verbose \
            --dart-define=BUILD_VERSION="$BUILD_VERSION" \
            --dart-define=BUILD_COMMIT="$SHORT_SHA" \
            --dart-define=BUILD_CHANNEL=nightly
      - name: Build iss script
        if: matrix.os == 'windows-latest'
        run: dart run inno_bundle:build --no-app --release --no-installer
      - name: Remove non-English languages from iss script
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $issPath = "./build/windows/x64/installer/Release/inno-script.iss"
          $content = Get-Content -Path $issPath
          $content = $content | Where-Object { $_ -notmatch 'compiler:Languages\\' }
          Set-Content -Path $issPath -Value $content
      - name: Add Registry entries for deep links
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $issPath = "./build/windows/x64/installer/Release/inno-script.iss"
          $registrySection = @"

          [Registry]
          Root: HKCR; Subkey: "dion"; ValueType: string; ValueData: "URL:Dion Protocol"; Flags: uninsdeletekey
          Root: HKCR; Subkey: "dion"; ValueType: string; ValueName: "URL Protocol"; ValueData: ""
          Root: HKCR; Subkey: "dion\DefaultIcon"; ValueType: string; ValueData: "{app}\dion.exe,0"
          Root: HKCR; Subkey: "dion\shell\open\command"; ValueType: string; ValueData: """{app}\dion.exe"" ""%1"""
          "@

          Add-Content -Path $issPath -Value $registrySection

      - name: Build installer
        if: matrix.os == 'windows-latest'
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: ./build/windows/x64/installer/Release/inno-script.iss
      - name: Move installer
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          # Tag the installer with the arch it was built for so the updater can
          # pick exactly this one.
          for f in ./build/windows/x64/installer/Release/*.exe; do
            mv "$f" "./output/$(basename "$f" .exe)-x64.exe"
          done

      - uses: actions/upload-artifact@v4
        with:
          path: "./output/*"
          name: dion-nightly-${{ matrix.os }}-${{ matrix.build_mode }}

  Publish:
    needs: Build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compute build metadata
        shell: bash
        run: |
          NORMAL_VERSION=$(awk '/^version:/ { print $2 }' pubspec.yaml)
          SHORT_SHA=$(git rev-parse --short HEAD)
          COMMIT_DATE=$(git show -s --format=%cI HEAD)
          BUILD_VERSION="${NORMAL_VERSION}+nightly.${SHORT_SHA}"
          {
            echo "NORMAL_VERSION=$NORMAL_VERSION"
            echo "SHORT_SHA=$SHORT_SHA"
            echo "BUILD_VERSION=$BUILD_VERSION"
            echo "COMMIT_DATE=$COMMIT_DATE"
          } >> "$GITHUB_ENV"
      - name: Write nightly.json manifest
        shell: bash
        run: |
          cat > nightly.json <<EOF
          {
            "version": "$BUILD_VERSION",
            "base_version": "$NORMAL_VERSION",
            "commit": "$SHORT_SHA",
            "commit_date": "$COMMIT_DATE",
            "channel": "nightly"
          }
          EOF
          cat nightly.json
      - uses: actions/download-artifact@v4
        with:
          pattern: dion-nightly-*
          merge-multiple: true
          path: ./output
      - name: Tag build commit
        run: |
          # -f: a cancelled run can leave a stale nightly tag behind.
          git tag -f nightly
          git push -f origin nightly

      # Single rolling release tagged `nightly`. makeLatest: false keeps the
      # real latest release untouched.
      - uses: ncipollo/release-action@v1
        with:
          tag: nightly
          name: Nightly ${{ env.BUILD_VERSION }}
          prerelease: true
          makeLatest: "false"
          allowUpdates: true
          replacesArtifacts: true
          artifacts: "./output/*,./nightly.json"
          body: |
            Automated nightly build from ${{ env.SHORT_SHA }}.

            - Version: ${{ env.BUILD_VERSION }}
            - Base version: ${{ env.NORMAL_VERSION }}
            - Commit: ${{ env.SHORT_SHA }}
            - Commit date: ${{ env.COMMIT_DATE }}

            This build tracks the latest commit on main. It is updated on every push, replacing the previous artifacts.
